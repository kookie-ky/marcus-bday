<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Marcus — Birthday </title>
  <meta
    name="description"
    content="A little birthday mix made just for Marcus ♡"
  >

  <!-- Open Graph / Link Preview -->
  <meta property="og:title" content="Marcus — Birthday Mix ">
  <meta
    property="og:description"
    content="A little birthday surprise made just for you ♡"
  >
  <meta property="og:type" content="website">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="player">

    <div class="headphones">🎧</div>

    <p class="small-label">SPECIAL RELEASE</p>

    <h1>MARCUS</h1>

    <p class="subtitle">BIRTHDAY MIX</p>

    <div class="divider"></div>

    <div class="album">

      <div class="album-art">
        <span>🎵</span>
      </div>

      <div class="song-info">
        <p class="now-playing">NOW PLAYING</p>
        <h2>Something Special</h2>
        <p>Made just for you ♡</p>
      </div>

    </div>

    <div class="equalizer" id="equalizer">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="track-info">
      <span>00:00</span>
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
      <span>∞:∞</span>
    </div>

    <button id="startButton">
      ▶ PLAY
    </button>

    <p class="hint">
      There's something waiting for you...
    </p>

  </main>

  <script src="script.js"></script>

</body>
</html>
